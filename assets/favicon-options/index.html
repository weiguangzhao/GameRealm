<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>GameRealm / Favicon options</title><link id="preview-icon" rel="icon" type="image/svg+xml" href="01-portal-g.svg"><style>
*{box-sizing:border-box}body{margin:0;padding:40px 24px 52px;background:#f5f7fb;color:#192b4d;font-family:Arial,sans-serif}main{max-width:1080px;margin:auto}h1{margin:0;font-size:30px;letter-spacing:-.8px}p{color:#6b7486;line-height:1.7}section{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-top:28px}.option button{width:100%;height:100%;padding:24px;border:1px solid #dfe5ee;border-radius:18px;background:white;text-align:left;color:inherit;font:inherit;cursor:pointer;transition:border-color .15s,box-shadow .15s}.option button:hover{border-color:#aab9e4}.option button[aria-pressed=true]{border-color:#4969e8;box-shadow:0 0 0 2px #4969e823}.option button:focus-visible{outline:3px solid #93aaf5;outline-offset:4px}.name{display:block;font-weight:bold;font-size:18px}.large{display:block;margin:30px auto}.sizes{display:flex;align-items:center;justify-content:center;gap:35px;color:#788294;font-size:13px}.sizes>span{display:flex;align-items:center;gap:10px}.note{display:block;color:#788294;font-size:13px;line-height:1.6;margin-top:24px}#status{font-weight:bold;color:#4969e8;margin-top:26px}@media(max-width:760px){section{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:480px){section{grid-template-columns:1fr}h1{font-size:26px}}
</style></head><body><main><h1>GameRealm / Favicon options</h1><p>Click a design to preview its favicon in this browser tab.<br>Tell me the option number when you have a favorite.</p><section aria-label="Favicon designs"><article class="option"><button type="button" data-icon="01-portal-g.svg" data-name="01 Portal G" aria-pressed="true"><span class="name">01 Portal G</span><img class="large" src="01-portal-g.svg" alt="Portal G" width="96" height="96"><span class="sizes"><span><img src="01-portal-g-32.png" alt="" width="32" height="32">32px</span><span><img src="01-portal-g-16.png" alt="" width="16" height="16">16px</span></span><span class="note">A bold G with a portal-like opening.</span></button></article><article class="option"><button type="button" data-icon="02-realm-cube.svg" data-name="02 Realm Cube" aria-pressed="false"><span class="name">02 Realm Cube</span><img class="large" src="02-realm-cube.svg" alt="Realm Cube" width="96" height="96"><span class="sizes"><span><img src="02-realm-cube-32.png" alt="" width="32" height="32">32px</span><span><img src="02-realm-cube-16.png" alt="" width="16" height="16">16px</span></span><span class="note">Solid geometry with clear spatial depth.</span></button></article><article class="option"><button type="button" data-icon="03-orbital-world.svg" data-name="03 Orbital World" aria-pressed="false"><span class="name">03 Orbital World</span><img class="large" src="03-orbital-world.svg" alt="Orbital World" width="96" height="96"><span class="sizes"><span><img src="03-orbital-world-32.png" alt="" width="32" height="32">32px</span><span><img src="03-orbital-world-16.png" alt="" width="16" height="16">16px</span></span><span class="note">A world symbol with a bright satellite.</span></button></article><article class="option"><button type="button" data-icon="04-gamepad.svg" data-name="04 Gamepad" aria-pressed="false"><span class="name">04 Gamepad</span><img class="large" src="04-gamepad.svg" alt="Gamepad" width="96" height="96"><span class="sizes"><span><img src="04-gamepad-32.png" alt="" width="32" height="32">32px</span><span><img src="04-gamepad-16.png" alt="" width="16" height="16">16px</span></span><span class="note">An immediately recognizable game symbol.</span></button></article><article class="option"><button type="button" data-icon="05-gr-monogram.svg" data-name="05 GR Monogram" aria-pressed="false"><span class="name">05 GR Monogram</span><img class="large" src="05-gr-monogram.svg" alt="GR Monogram" width="96" height="96"><span class="sizes"><span><img src="05-gr-monogram-32.png" alt="" width="32" height="32">32px</span><span><img src="05-gr-monogram-16.png" alt="" width="16" height="16">16px</span></span><span class="note">The project initials in a compact mark.</span></button></article><article class="option"><button type="button" data-icon="06-scene-layers.svg" data-name="06 Scene Layers" aria-pressed="false"><span class="name">06 Scene Layers</span><img class="large" src="06-scene-layers.svg" alt="Scene Layers" width="96" height="96"><span class="sizes"><span><img src="06-scene-layers-32.png" alt="" width="32" height="32">32px</span><span><img src="06-scene-layers-16.png" alt="" width="16" height="16">16px</span></span><span class="note">Layered scenes and multiple viewpoints.</span></button></article></section><p id="status" role="status">Previewing 01 Portal G</p></main><script>
const buttons=Array.from(document.querySelectorAll('[data-icon]'));
buttons.forEach(button=>button.addEventListener('click',()=>{
 buttons.forEach(other=>other.setAttribute('aria-pressed',String(other===button)));
 document.getElementById('preview-icon').href=button.dataset.icon;
 document.title=button.dataset.name+' / GameRealm';
 document.getElementById('status').textContent='Previewing '+button.dataset.name;
}));
</script></body></html>
